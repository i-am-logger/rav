# Release configuration. The workflow restricts releasing to master; this file
# decides what gets released once there.

[workspace]
# Defaults for every member; the per-package blocks at the end override what has
# to differ. Without them both crates would claim the same tag, since the name is
# a literal rather than a template over the package.
git_release_enable = true

# "auto" marks a version carrying a pre-release suffix as a GitHub pre-release,
# so a beta does not present itself as the latest stable download.
git_release_type = "auto"

# cargo-semver-checks before each release: a breaking change proposed as a patch
# bump is rejected and the version escalated.
semver_check = true

# Publishing requires merging a Release PR. An ordinary commit landing on master
# does not publish, however it got there. crates.io is immutable, so the second
# merge is the point.
release_always = false

# A release is triggered by changes to packaged files. README.md, docs/, LICENSE,
# themes/ and src/ ship inside the crate, so editing any of them needs a new
# version before crates.io shows it. .github/ is not packaged.

pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# The changelog carries what a user of the crate would notice. Everything else -
# chore, ci, build, test, refactor, and release-plz's own release commits - is
# skipped by the trailing catch-all.
#
# Group names match the Keep a Changelog headings the header above promises.
# These replace git-cliff's defaults rather than adding to them, so feat and fix
# have to be listed for them to appear at all.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = ".*", skip = true },
]

# rav is the crate anyone installs, so it keeps the tag format already in this
# repository's history and it is the one that gets a GitHub release.
[[package]]
name = "rav"
git_tag_name = "rav-v{{ version }}"
git_release_enable = true

# rav-core is published because cargo requires it, not because anyone installs
# it: a crate cannot go to crates.io with a path dependency that is not there,
# so `rav` is unpublishable unless `rav-core` is published alongside. It is
# tagged separately to keep the histories apart, and gets no GitHub release -
# there is nothing to download, and a second entry on the releases page would
# suggest otherwise.
[[package]]
name = "rav-core"
git_tag_name = "rav-core-v{{ version }}"
git_release_enable = false
