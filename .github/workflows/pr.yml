name: Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-pr:
    name: Manage PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # with:
          # ref: ${{ github.head_ref }}
      - name: create Draft PR
        uses : ./.github/jobs/pr/create
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    needs: manage-pr
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (ALSA/Pulse)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpulse-dev pkg-config
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --no-deps -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [manage-pr, lint]
    steps:
      - uses: actions/checkout@v4
        # with:
        #   ref: ${{ github.head_ref }}
      - name: Build (Nix)
        uses: ./.github/jobs/rust/build

  manage-pr-success:
    name: Manage PR (Success)
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run ready action
        uses: ./.github/jobs/pr/ready
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manage-pr-failure:
    name: Manage PR (Failure)
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Run fail action
        uses: ./.github/jobs/pr/fail
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
