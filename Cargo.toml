[package]
name = "rav"
version = "0.2.4"
edition = "2021"
authors = ["RAV Team <i-am-logger@users.noreply.github.com>"]
description = "RAV (Rust Audio Visualizer): High-performance terminal audio visualizer built with Rust and ratatui"
license-file = "LICENSE"
repository = "https://github.com/i-am-logger/rav"
keywords = ["audio", "visualizer", "terminal", "tui", "cava"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
# Terminal User Interface
ratatui = "0.29"
crossterm = "0.28"

# Audio capture and processing
alsa = "0.9"
cpal = "0.15"
portaudio-rs = "0.3"
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# Signal processing and FFT
rustfft = "6.2"
realfft = "3.3"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
confy = "0.6"

# Error handling and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime and channels
tokio = { version = "1.0", features = ["full"] }
flume = "0.11"

# Mathematical operations
num-complex = "0.4"
num-traits = "0.2"

# Utilities
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
once_cell = "1.19"
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bin]]
name = "rav"
path = "src/main.rs"

[[bin]]
name = "visual_test"
path = "src/bin/visual_test.rs"

[[bin]]
name = "comprehensive_visual_test"
path = "src/bin/comprehensive_visual_test.rs"

[[bin]]
name = "test_v1_interface"
path = "src/bin/test_v1_interface.rs"

[[bin]]
name = "test_v1_with_visual_framework"
path = "src/bin/test_v1_with_visual_framework.rs"

[[bin]]
name = "visual_analyzer"
path = "src/bin/visual_analyzer.rs"

[[bin]]
name = "test_audio_pipeline"
path = "src/bin/test_audio_pipeline.rs"

[[bin]]
name = "frequency_test_suite"
path = "src/bin/frequency_test_suite.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
