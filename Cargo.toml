# rav is both the workspace root and the binary. rav-core is a member rather
# than a directory of modules because the boundary has to hold mechanically: it
# is `no_std` and allocation-free, and a crate cannot acquire a dependency on an
# allocator, a clock or a terminal by accident where a module can.
[workspace]
members = ["crates/rav-core", "crates/rav-appearance"]

# Stated once, inherited by every member. The crates ship together and their
# versions have to move together - a rav built against a different rav-core is
# not a configuration anyone should be able to reach by editing one file.
[workspace.package]
version = "1.0.0-beta.13"
edition = "2024"
# The floor the dependency graph imposes, not rav's own source. One crate holds
# it: `darling_core`, reached as ratatui -> instability -> darling ->
# darling_core. Only the first of those is a dependency rav names; the rest
# arrive underneath it. Nothing else in the graph asks for more than 1.87, so
# that is the single manifest to look at if this ever wants lowering.
#
# `instability` was named here too and has since relaxed to 1.64, which is worth
# knowing: this number moves when somebody else's manifest does, not when rav's
# source does.
rust-version = "1.88"
authors = ["RAV Team <i-am-logger@users.noreply.github.com>"]
repository = "https://github.com/i-am-logger/rav"

# Both a path and a version: the path is what the workspace builds against, and
# the version is what a published rav requires, so the two cannot drift.
[dev-dependencies]
proptest.workspace = true

[workspace.dependencies]
rav-core = { path = "crates/rav-core", version = "1.0.0-beta.13" }
rav-appearance = { path = "crates/rav-appearance", version = "1.0.0-beta.13" }
# Dev-only, so nothing published gains a dependency. Shared here for the same
# reason the versions are: two crates disagreeing about a test framework is a
# thing that happens quietly.
proptest = "1"

[package]
name = "rav"
version.workspace = true
# There are two binaries, so `cargo run` cannot guess. Without this it errors
# out and tells you to pass --bin, which is a poor first impression.
default-run = "rav"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust audio visualiser: a real-time spectrum analyser with bars, peak caps and an oscilloscope, in truecolour"
license-file = "LICENSE"
repository.workspace = true
homepage = "https://github.com/i-am-logger/rav"
documentation = "https://github.com/i-am-logger/rav#readme"
readme = "README.md"
# crates.io allows at most five keywords, each at most 20 characters.
keywords = ["winamp", "audio", "visualizer", "spectrum", "tui"]
categories = ["multimedia::audio", "command-line-utilities", "visualization"]
# Named file by file, never `assets/` as a directory: the built-in segment skin
# lives there and is an `include_str!`, so excluding the directory produces a
# package that does not compile. The demo is 2.4MB and is linked absolutely from
# the README, which crates.io serves from the repository rather than the package.
exclude = ["assets/demo.gif", ".github/", "devenv.nix", "devenv.yaml", "devenv.lock"]

# Denied rather than warned: a warning in a `nix build` scrolls past in CI logs
# and nobody sees it. `dead_code` is a member of `unused`, so this covers the
# cross-platform case that started it - fields used only behind
# `#[cfg(target_os = "macos")]` are genuinely dead on Linux and should say so.
[lints.rust]
unused = "deny"

[dependencies]
# The mechanics: levels, steps, geometry, and what a display can show. no_std and
# allocation-free, so the same crate builds for a microcontroller unchanged.
rav-core = { workspace = true }
# Themes, ramps and colour - what an abstract step looks like. no_std, and it
# names no rasteriser, so the same theme dresses every surface.
rav-appearance = { workspace = true }

# Terminal User Interface
ratatui = "0.28"
crossterm = "0.28"

# Audio capture and processing
# cpal is the only backend used; it selects ALSA on Linux and CoreAudio on macOS.
cpal = "0.15"

# Signal processing and FFT.
#
# `rustfft` is not named here. realfft is built on it and re-exports what rav
# touches - `realfft::num_complex::Complex` - so declaring it too was a version
# constraint kept for nothing, and one that could argue with realfft's own.
realfft = "3.3"

# Rasterising, for the surfaces that draw pixels rather than glyphs.
#
# CPU rather than a GPU crate: every surface needs the frame in main memory
# anyway - the terminal writes it to a file the terminal reads, and a window can
# blit it - so rendering on the GPU would mean a readback stall on the path that
# matters most. It also pairs with resvg for the SVG skins later, and works with
# no device or surface, which is what makes a frame testable at all.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling and logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime and channels.
#
# The features rav uses, rather than `full`. `full` claims rav needs all of
# tokio - it does not touch `net`, `process` or the io helpers - and the claim
# cost every install one crate it never ran: socket2, through the networking
# tokio was told to bring.
#
# `signal` is what keeps mio, and it is the one that has to be here: Ctrl-C is
# handled through `tokio::signal::ctrl_c`.
tokio = { version = "1.0", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
flume = "0.11"

# Utilities
clap = { version = "4.5", features = ["derive"] }
# Only for poll(2), so the terminal palette query can wait with a deadline
# instead of blocking forever on a terminal that never answers.
libc = "0.2"

dirs = "5.0"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }

# A window of rav's own. Optional and off by default: a terminal visualiser
# should not make everyone who installs it build a windowing stack.
#
# softbuffer rather than wgpu, because the frame is already a `Pixmap` on the
# CPU - this is one more blit target, not a second renderer, and wgpu would
# bring a GPU abstraction to move bytes that are already where they need to be.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"], optional = true }

# `--all-features` is what devenv runs clippy and the tests under, so this is
# compiled on both platforms in CI whether or not anybody turns it on.
#
# It needs no system libraries to *build*: winit and softbuffer dlopen X11 and
# Wayland rather than linking them, which is why `flake.nix` names none. The
# dev shell carries them so a window opened from there has something to open
# on, and that is the only place they belong.
[features]
gui = ["dep:winit", "dep:softbuffer", "dep:font8x8"]

[[bin]]
name = "rav"
path = "src/main.rs"

[[bin]]
name = "test_audio_pipeline"
path = "src/bin/test_audio_pipeline.rs"

# Measures whether a terminal can carry rav's frames as pixels, ahead of the
# renderer that would depend on it. See issue #65.
[[bin]]
name = "kitty_spike"
path = "src/bin/kitty_spike.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
